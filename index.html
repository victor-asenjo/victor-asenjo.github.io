<body>
  <div class="grain"></div>

  <script>
    // Tweak defaults — change here to update prod appearance
    window.__TWEAK_DEFAULTS = {
      "theme": "light",
      "accent": "#c2410c",
      "fontset": "display-serif",
      "density": 1.1
    };
    // Dev mode: add ?dev to URL to access tweaks panel
    window.__DEV_MODE = location.search.includes('dev');
  </script>

  <div id="root"></div>

  <script type="text/babel" src="hero.jsx?v=3"></script>
  <script type="text/babel" src="timeline.jsx?v=3"></script>
  <script type="text/babel" src="terminal.jsx?v=3"></script>
  <script type="text/babel" src="projects.jsx?v=3"></script>
  <script type="text/babel" src="modules.jsx?v=3"></script>
  <script type="text/babel" src="tweaks.jsx?v=3"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function Nav({ theme, onThemeToggle }) {
      const [open, setOpen] = React.useState(false);
      const links = [
        { h: '#about',      n: '01', l: 'About' },
        { h: '#experience', n: '02', l: 'Career' },
        { h: '#work',       n: '03', l: 'Work' },
        { h: '#teaching',   n: '04', l: 'Teaching' },
        { h: '#toolkit',    n: '05', l: 'Toolkit' },
        { h: '#contact',    n: '06', l: 'Contact' },
      ];
      const close = () => setOpen(false);
      return (
        <>
          <nav className="nav">
            <a href="#top" className="nav-brand">
              <span className="dot" />
              <span>Víctor<span style={{color: 'var(--accent)'}}>.</span></span>
            </a>
            {/* Desktop links */}
            <div className="nav-links nav-links-desktop">
              {links.map(L => (
                <a key={L.h} href={L.h}>
                  <span className="num">{L.n}</span>{L.l}
                </a>
              ))}
            </div>
            {/* Right controls */}
            <div className="nav-controls">
              <button className="nav-theme-btn" onClick={onThemeToggle} title="Toggle dark mode" aria-label="Toggle dark mode">
                {theme === 'dark' ? '☀' : '☾'}
              </button>
              <button className="nav-burger" onClick={() => setOpen(o => !o)} aria-label="Menu">
                <span className={`burger-line ${open ? 'open' : ''}`} />
                <span className={`burger-line ${open ? 'open' : ''}`} />
                <span className={`burger-line ${open ? 'open' : ''}`} />
              </button>
            </div>
          </nav>
          {/* Mobile overlay menu */}
          {open && (
            <div className="nav-mobile-overlay" onClick={close}>
              <div className="nav-mobile-menu" onClick={e => e.stopPropagation()}>
                {links.map(L => (
                  <a key={L.h} href={L.h} className="nav-mobile-link" onClick={close}>
                    <span className="num">{L.n}</span>{L.l}
                  </a>
                ))}
              </div>
            </div>
          )}
        </>
      );
    }

    function App() {
      const [state, setState] = useState(() => {
        const def = window.__TWEAK_DEFAULTS;
        try {
          const saved = JSON.parse(localStorage.getItem('portfolio:tweaks') || 'null');
          return saved ? { ...def, ...saved } : def;
        } catch { return def; }
      });

      useEffect(() => {
        document.documentElement.dataset.theme = state.theme;
        document.documentElement.dataset.fontset = state.fontset;
        document.documentElement.style.setProperty('--accent', state.accent);
        const hex = state.accent.replace('#', '');
        const r = parseInt(hex.slice(0,2), 16);
        const g = parseInt(hex.slice(2,4), 16);
        const b = parseInt(hex.slice(4,6), 16);
        document.documentElement.style.setProperty('--accent-soft', `rgba(${r}, ${g}, ${b}, 0.12)`);
        document.documentElement.style.setProperty('--density', String(state.density));
        try { localStorage.setItem('portfolio:tweaks', JSON.stringify(state)); } catch {}
      }, [state]);

      const toggleTheme = () => setState(s => ({ ...s, theme: s.theme === 'dark' ? 'light' : 'dark' }));

      return (
        <>
          <Nav theme={state.theme} onThemeToggle={toggleTheme} />
          <main className="shell">
            <Hero />
            <Terminal />
            <Timeline />
            <Projects />
            <Teaching />
            <Speaking />
            <Toolkit />
            <Contact />
          </main>
          <Tweaks state={state} setState={setState} />
        </>
      );
    }


    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
